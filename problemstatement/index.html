
<!DOCTYPE html>
<html>
<head>
    <title>Event Registration</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<form id="myForm">

<h2>Event Registration Form</h2>


<input type="text" id="name">
<p id="nameError" class="error"></p>
<input type="email" id="email">
<p id="emailError" class="error"></p>
<input type="text" id="mobile">
<p id="mobileError" class="error"></p>
<input type="date" id="dob">
<p id="dobError" class="error"></p>
<br>
<input type="radio" name="gender" value="Male"> Male
<input type="radio" name="gender" value="Female"> Female
<input type="radio" name="gender" value="Other"> Other
<p id="genderError" class="error"></p>

   
<select id="workshop">
    <option value="">Select Workshop</option>
    <option>Web Development</option>
    <option>Data Analytics</option>
    <option>Artificial Intelligence</option>
</select>
<p id="workshopError" class="error"></p>

Skills Known:<br>
<input type="checkbox" name="skills" value="HTML"> HTML
<input type="checkbox" name="skills" value="CSS"> CSS
<input type="checkbox" name="skills" value="JavaScript"> JavaScript
<input type="checkbox" name="skills" value="Python"> Python
<p id="skillsError" class="error"></p>

    <input type="checkbox" id="terms"> I accept Terms and Conditions
    <p id="termsError" class="error"></p>

    <button type="submit">Register</button>

    <h3 id="message"></h3>

</form>

<script src="script.js"></script>

</body>
</html>
